  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  package_info_plus: ^8.0.2
  network_info_plus: ^6.0.0
  permission_handler: ^11.3.0
  noise_meter: ^6.0.0
  multicast_dns: ^0.3.2
  in_app_purchase: ^3.3.0
  syncfusion_flutter_pdf: ^33.1.49
  

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  pdf: ^3.11.0
  printing: ^5.13.4
  http: ^1.2.0
  url_launcher: ^6.3.0
  file_picker: ^8.0.0
  archive: ^4.0.9
  xml: ^6.5.0
  web: ^1.0.0
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  wifi_scan: ^0.4.1

  # Visualiseur MVR 3D (six plateformes : android/ios/linux/macos/web/windows)
