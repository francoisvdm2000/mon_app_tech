  google_sign_in: ^6.2.2

  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

# Écran noir sur Android avec three_js_angle_renderer 0.0.1 (pub.dev, publié
# avant le correctif) : bug connu du mainteneur (mauvaise adresse mémoire
# TypedData transmise à ANGLE côté Vulkan sur certains GPU — voir
# https://github.com/Knightro63/three_js/issues/136). Le correctif est déjà
# sur la branche main du dépôt mais n'a pas encore été republié sur pub.dev,
# d'où cette dépendance vers le dépôt Git en attendant une nouvelle version.
#
# IMPORTANT : les 3 overrides ci-dessous pointent vers le MÊME commit figé
# (ref:), jamais vers "main" flottant (sinon le prochain `pub get` récupère
# une nouvelle version de main qui peut casser le build, comme le 15/09/2026 :
# three_js_angle_renderer (Git) utilise des classes — Info, Properties — qui
# n'existent pas encore dans three_js_core 0.3.0 publié sur pub.dev, d'où
# l'erreur "Type 'Info' not found" tant que three_js_core n'est pas, lui
# aussi, épinglé sur ce même commit Git.
# Pour mettre à jour vers un commit plus récent : changer les 3 `ref:`
# ensemble, jamais un seul isolément.
dependency_overrides:
  three_js_angle_renderer:
    git:
      url: https://github.com/Knightro63/three_js.git
      path: packages/three_js_angle_renderer
      ref: 43814addd7ce3ed2c560dcd08cb491a9546977b0
  three_js_math:
    git:
      url: https://github.com/Knightro63/three_js.git
      path: packages/three_js_math
      ref: 43814addd7ce3ed2c560dcd08cb491a9546977b0
  three_js_core:
    git:
      url: https://github.com/Knightro63/three_js.git
      path: packages/three_js_core
      ref: 43814addd7ce3ed2c560dcd08cb491a9546977b0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/lumiere/fixtures.json
    - assets/icon/
    - assets/lumiere/filters.json
    - assets/lumiere/filter_equivalents.json
    - assets/tool_icons/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21