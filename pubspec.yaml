  three_js_controls: ^0.3.0

  # Meta / Facebook App Events
  facebook_app_events: ^0.27.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_storage: ^12.3.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
